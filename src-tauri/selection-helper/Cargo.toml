[package]
name = "selection-helper"
version = "4.0.0"
edition = "2021"
publish = false

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
enigo = "0.2.1"
windows = { version = "0.58.0", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_Foundation"] }

[package]
name = "pot"
version = "4.5.3"
description = "小允翻译：本地学术翻译与 AI 论文阅读器"
authors = ["Xiaoyun"]
license = "GPL-3.0-only"
repository = "https://github.com/Xiaoyun-0922/xiaoyun-translator"
edition = "2021"
default-run = "pot"

[[bin]]
name = "pot"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]

tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = { version = "2" }
tauri-plugin-store = { version = "2" }
tauri-plugin-log = { version = "2" }
tauri-plugin-global-shortcut = { version = "2" }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0.1"
once_cell = "1.19.0"
mouse_position = "0.1.4"
log = "0.4"
screenshots = "=0.7.2"
base64 = "0.22"
arboard = "3.4"
reqwest = { version = "0.12", features = ["json"] }
image = "0.25.4"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
roxmltree = "0.20"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
selection = "1.2.0"

[target.'cfg(windows)'.dependencies]
enigo = "0.2.1"
windows = {version="0.58.0",features= ["Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_Foundation", "Graphics_Imaging", "Media_Ocr", "Media_SpeechSynthesis", "Foundation", "Foundation_Collections", "Globalization", "Storage", "Storage_Streams"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

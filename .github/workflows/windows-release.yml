name: Windows release

on:
    workflow_dispatch:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    build:
        name: Build Windows x64 installer
        runs-on: windows-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.18.1

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: pnpm

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run frontend tests
              run: pnpm test

            - name: Run Rust tests
              run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

            - name: Build NSIS installer
              run: pnpm tauri build

            - name: Generate SHA-256 checksum
              shell: pwsh
              run: |
                  $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
                  if (-not $installer) {
                      throw 'NSIS installer was not generated.'
                  }
                  $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash
                  "$hash *$($installer.Name)" | Set-Content -Encoding utf8 'checksums-windows-x64.txt'

            - name: Upload workflow artifact
              uses: actions/upload-artifact@v4
              with:
                  name: xiaoyun-translator-windows-x64
                  path: |
                      src-tauri/target/release/bundle/nsis/*-setup.exe
                      checksums-windows-x64.txt
                  if-no-files-found: error

            - name: Attach installer to GitHub Release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  files: |
                      src-tauri/target/release/bundle/nsis/*-setup.exe
                      checksums-windows-x64.txt

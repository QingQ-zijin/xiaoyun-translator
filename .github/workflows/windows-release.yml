name: Windows release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

concurrency:
    group: windows-release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        name: Build signed Windows x64 updater
        runs-on: windows-latest
        env:
            RELEASE_TAG: ${{ github.ref_name }}

        steps:
            - name: Checkout source
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - name: Set up pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 10.18.1

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '22'
                  cache: pnpm

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with:
                  toolchain: stable

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
              with:
                  workspaces: src-tauri

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify tag and application versions
              shell: pwsh
              run: |
                  if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') {
                      throw "Invalid release tag: $env:RELEASE_TAG"
                  }
                  $tagVersion = $Matches[1]
                  $packageVersion = (Get-Content -Raw 'package.json' | ConvertFrom-Json).version
                  $tauriVersion = (Get-Content -Raw 'src-tauri/tauri.conf.json' | ConvertFrom-Json).version
                  $cargoText = Get-Content -Raw 'src-tauri/Cargo.toml'
                  $cargoMatch = [regex]::Match($cargoText, '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"')
                  if (-not $cargoMatch.Success) {
                      throw 'Could not read the Cargo package version.'
                  }
                  $cargoVersion = $cargoMatch.Groups[1].Value
                  if (@($packageVersion, $tauriVersion, $cargoVersion) |
                      Where-Object { $_ -ne $tagVersion }) {
                      throw "Version mismatch: tag=$tagVersion package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
                  }
                  $headTag = git tag --points-at HEAD --list $env:RELEASE_TAG
                  if ($headTag -ne $env:RELEASE_TAG) {
                      throw "HEAD is not tagged with $env:RELEASE_TAG"
                  }

            - name: Verify updater signing secrets
              shell: pwsh
              run: |
                  if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
                      throw 'TAURI_SIGNING_PRIVATE_KEY is not configured.'
                  }
                  if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
                      throw 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured.'
                  }
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

            - name: Run frontend tests
              run: pnpm test

            - name: Run Rust tests
              run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

            - name: Run strict Rust lint
              run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

            - name: Build and publish signed updater artifacts
              id: tauri
              uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
              with:
                  tagName: ${{ env.RELEASE_TAG }}
                  releaseName: 小允翻译 ${{ env.RELEASE_TAG }}
                  generateReleaseNotes: true
                  releaseDraft: true
                  prerelease: false
                  uploadUpdaterJson: true
                  updaterJsonPreferNsis: true
                  uploadUpdaterSignatures: true
                  releaseAssetNamePattern: xiaoyun-translator_[version]_[arch][setup][ext]
                  uploadWorkflowArtifacts: true
                  workflowArtifactNamePattern: xiaoyun-translator-windows-[platform]-[arch]
                  args: --config src-tauri/tauri.release.conf.json
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

            - name: Validate updater assets and attach SHA-256 checksum
              shell: pwsh
              run: |
                  $expectedVersion = (Get-Content -Raw 'package.json' | ConvertFrom-Json).version
                  $localInstallers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe')
                  if ($localInstallers.Count -ne 1) {
                      throw "Expected one local NSIS installer, found $($localInstallers.Count)."
                  }
                  $installer = $localInstallers[0]
                  $release = gh release view $env:RELEASE_TAG --json assets,isDraft | ConvertFrom-Json
                  if (-not $release.isDraft) {
                      throw 'The release must remain a draft until all updater assets are validated.'
                  }
                  $assetNames = @($release.assets | ForEach-Object { $_.name })
                  $installerAssets = @($assetNames | Where-Object { $_ -like 'xiaoyun-translator_*-setup.exe' })
                  $latestAssets = @($assetNames | Where-Object { $_ -eq 'latest.json' })
                  if ($installerAssets.Count -ne 1 -or $latestAssets.Count -ne 1) {
                      throw "Expected one installer and latest.json; assets: $($assetNames -join ', ')"
                  }
                  $installerAsset = $installerAssets[0]
                  $signatureAsset = "$installerAsset.sig"
                  if (@($assetNames | Where-Object { $_ -eq $signatureAsset }).Count -ne 1) {
                      throw "Updater signature asset is missing: $signatureAsset"
                  }
                  $validationDir = Join-Path 'release' 'validation'
                  New-Item -ItemType Directory -Force -Path $validationDir | Out-Null
                  gh release download $env:RELEASE_TAG --pattern 'latest.json' --pattern $signatureAsset --dir $validationDir --clobber
                  $latest = Get-Content -Raw (Join-Path $validationDir 'latest.json') | ConvertFrom-Json
                  if ($latest.version -ne $expectedVersion) {
                      throw "latest.json version $($latest.version) does not match $expectedVersion."
                  }
                  $windowsPlatforms = @(
                      $latest.platforms.PSObject.Properties |
                          Where-Object { $_.Name -match '^windows-x86_64' }
                  )
                  if ($windowsPlatforms.Count -ne 1) {
                      throw 'latest.json must contain exactly one Windows x86_64 platform.'
                  }
                  $platform = $windowsPlatforms[0].Value
                  $decodedUrl = [Uri]::UnescapeDataString([string]$platform.url)
                  if (-not $decodedUrl.EndsWith("/$installerAsset")) {
                      throw "latest.json points to an unexpected installer: $decodedUrl"
                  }
                  $signature = (Get-Content -Raw (Join-Path $validationDir $signatureAsset)).Trim()
                  if ([string]::IsNullOrWhiteSpace($signature) -or $signature -ne ([string]$platform.signature).Trim()) {
                      throw 'latest.json signature does not match the uploaded signature asset.'
                  }
                  $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash
                  "$hash *$installerAsset" |
                      Set-Content -Encoding utf8 'release/checksums-windows-x64.txt'
                  gh release upload $env:RELEASE_TAG 'release/checksums-windows-x64.txt' --clobber
              env:
                  GH_TOKEN: ${{ github.token }}

            - name: Publish validated release
              shell: pwsh
              run: gh release edit $env:RELEASE_TAG --draft=false --latest
              env:
                  GH_TOKEN: ${{ github.token }}
